name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to package version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$package_version" = "$lock_version"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:worker
      - name: Build temporary-signed macOS trial installer
        if: matrix.platform == 'macos-arm64' && (github.ref_name == 'v0.3.0' || github.ref_name == 'v0.4.0' || github.ref_name == 'v0.5.0' || github.ref_name == 'v0.5.1')
        run: bash scripts/build-mac-adhoc.sh
      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'macos-arm64' && github.ref_name != 'v0.3.0' && github.ref_name != 'v0.4.0' && github.ref_name != 'v0.5.0' && github.ref_name != 'v0.5.1'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing macOS release credential: $name" >&2
              exit 1
            fi
          done
      - name: Build macOS installer
        if: matrix.platform == 'macos-arm64' && github.ref_name != 'v0.3.0' && github.ref_name != 'v0.4.0' && github.ref_name != 'v0.5.0' && github.ref_name != 'v0.5.1'
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-arm64' && github.ref_name != 'v0.3.0' && github.ref_name != 'v0.4.0' && github.ref_name != 'v0.5.0' && github.ref_name != 'v0.5.1'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/MDEdit.app
          spctl --assess --type execute --verbose=4 dist/mac-arm64/MDEdit.app
          xcrun stapler validate dist/mac-arm64/MDEdit.app
      - name: Build Windows installer
        if: matrix.platform == 'windows-x64'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-arm64'
        with:
          name: installer-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-x64'
        with:
          name: installer-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          for file in release-assets/*.exe; do
            [ -e "$file" ] || continue
            renamed="${file// /.}"
            if [ "$file" != "$renamed" ]; then mv "$file" "$renamed"; fi
          done
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Create versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "MDEdit ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "MDEdit ${GITHUB_REF_NAME}" --generate-notes
          fi
